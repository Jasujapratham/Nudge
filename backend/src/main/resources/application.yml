# ==========================================================================
# Nudge - default backend configuration
# Runs with an embedded H2 database: no Docker and no PostgreSQL needed.
# Tables are created automatically on startup (ddl-auto: update).
# ==========================================================================

server:
  port: 8080

spring:
  application:
    name: nudge

  # ---- Embedded H2 database (default) ----
  datasource:
    # mem:  -> data lives only while the app runs (nothing to install or clean up)
    # file: -> use  jdbc:h2:file:./data/nudge  instead to keep data between restarts
    url: jdbc:h2:mem:nudgedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # Browser SQL console for the H2 database: http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    # Creates/updates the "users" and "reminders" tables automatically.
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

# ---- Nudge application settings ----
nudge:
  jwt:
    # Signing secret, used verbatim (it is simply a long random string that
    # happens to be written in Base64). Anything 64+ characters makes jjwt pick
    # HS512; under 32 characters the app refuses to start.
    # DEVELOPMENT ONLY - set NUDGE_JWT_SECRET to your own value for anything
    # other than localhost, otherwise anyone with this source can forge tokens.
    secret: ${NUDGE_JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1udWRnZS1qd3Qtc2VjcmV0LWNoYW5nZS1tZS0yMDI2LWRldmVsb3BtZW50LW9ubHk=}
    # Token lifetime in minutes (720 = 12 hours).
    expiration-minutes: ${NUDGE_JWT_EXPIRATION_MINUTES:720}
  cors:
    # Vite dev servers usually run on 5173; 5174 is used if 5173 is busy.
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}

logging:
  level:
    com.nudge: INFO
